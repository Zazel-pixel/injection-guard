name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies to install: the guard and its tools use the standard
      # library only. test_corpus.py fails if detection drops or false alarms
      # grow on the committed corpus.
      - run: python -m unittest discover -s tests -v
      - run: python evaluate.py
